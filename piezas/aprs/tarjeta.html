      <section class="card span2" id="aprs">
        <div class="card-head">
          <span class="card-title">APRS</span>
          <span class="card-meta" id="aprs-meta">--</span>
        </div>
        <div class="card-body">
          <div class="lh-filters">
            <button class="lh-chip" data-aprs-tab="est">Estaciones</button>
            <button class="lh-chip" data-aprs-tab="msg">Mensajes <span id="aprs-badge"></span></button>
            <span style="display:inline-block;width:14px"></span>
            <button class="lh-chip" id="aprs-bal">Baliza: --</button>
            <label style="font-size:0.85em">radio <input type="number" min="5" max="500" step="10" id="aprs-rad" style="width:65px"> km <span id="aprs-rad-msg" style="opacity:.75"></span></label>
            <button class="lh-chip" id="aprs-ahora">Enviar ahora</button>
            <input type="text" id="aprs-q" placeholder="Buscar indicativo o parte (todos los SSID)" maxlength="10" style="width:210px;text-transform:uppercase">
            <select id="aprs-mapa" title="Mapa para ver la ubicación de una estación"><option value="osm">Mapa: OpenStreetMap</option><option value="aprsfi">Mapa: aprs.fi</option><option value="google">Mapa: Google Maps</option></select>
          </div>
          <div id="aprs-conc" class="aprs-conc" style="display:none"></div>
          <div id="aprs-est" style="max-height:300px;overflow-y:auto;">
            <table class="lh-table">
              <thead><tr><th data-aprs-sort="call" style="cursor:pointer;user-select:none">Indicativo<span class="aprs-flecha"></span></th><th data-aprs-sort="dist" style="cursor:pointer;user-select:none">Distancia<span class="aprs-flecha"></span></th><th data-aprs-sort="hace" style="cursor:pointer;user-select:none">Hace<span class="aprs-flecha"></span></th><th>Comentario</th></tr></thead>
              <tbody id="aprs-est-body"><tr><td colspan="4" class="lh-empty">Cargando...</td></tr></tbody>
            </table>
          </div>
          <div id="aprs-msg" style="display:none;">
            <div style="text-align:right;margin-bottom:4px"><button class="lh-chip" id="aprs-borrar-todo">Borrar todos</button></div>
            <div id="aprs-msglist" style="max-height:240px;overflow-y:auto;font-size:0.9em;margin-bottom:8px;"></div>
            <div style="display:flex;gap:6px;">
              <input type="text" id="aprs-to" placeholder="CALL-SSID" maxlength="9" style="width:110px;text-transform:uppercase">
              <input type="text" id="aprs-txt" placeholder="Mensaje (máx. 67 caracteres)" maxlength="67" style="flex:1">
              <button class="lh-chip" id="aprs-send">Enviar</button>
            </div>
          </div>
        </div>
      </section>
